name: Build ABC Adventure APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Kotlin source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/abcadventure/MainActivity.kt')
          s = p.read_text()
          old = '''        AnimatedVisibility(tapped, enter = fadeIn(tween(250)) + scaleIn(), initiallyVisible = true) {\n            Text("${letter.emoji}  ${letter.upper} for ${letter.word}!", fontSize = 23.sp, fontWeight = FontWeight.Black)\n        }'''
          new = '''        if (tapped) {\n            Text("${letter.emoji}  ${letter.upper} for ${letter.word}!", fontSize = 23.sp, fontWeight = FontWeight.Black)\n        }'''
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: abc-adventure-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
